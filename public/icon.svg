<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deckGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="180" height="180" rx="40" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="176" height="176" rx="38" stroke="url(#deckGrad)" stroke-width="4" stroke-opacity="0.8" />

  <!-- Background Stacked Slide Effect -->
  <rect x="42" y="32" width="96" height="62" rx="10" fill="#38bdf8" fill-opacity="0.25" />
  
  <!-- Foreground Main Slide Canvas -->
  <rect x="30" y="44" width="120" height="78" rx="12" fill="#1e293b" stroke="url(#deckGrad)" stroke-width="3" />
  
  <!-- Accent Top Header Bar -->
  <path d="M30 56C30 49.3726 35.3726 44 42 44H138C144.627 44 150 49.3726 150 56V60H30V56Z" fill="url(#deckGrad)" />

  <!-- Slide Content Lines & Visuals -->
  <!-- Header Title Mock -->
  <rect x="44" y="70" width="46" height="7" rx="3.5" fill="#f8fafc" />
  <!-- Subtitle Line Mock -->
  <rect x="44" y="82" width="70" height="5" rx="2.5" fill="#94a3b8" />
  <!-- Small Card / Visual Block inside Slide -->
  <rect x="44" y="94" width="28" height="16" rx="4" fill="#38bdf8" fill-opacity="0.4" />
  <rect x="78" y="94" width="58" height="6" rx="3" fill="#64748b" />
  <rect x="78" y="104" width="42" height="6" rx="3" fill="#64748b" />

  <!-- Slide Projector Stand / Pedestal -->
  <path d="M85 124V142H95V124" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="M68 142H112" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
</svg>